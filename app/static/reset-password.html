<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 - meetseek</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-950">
  <main class="mx-auto flex min-h-screen max-w-lg items-center px-5 py-12">
    <section class="w-full rounded-3xl border border-slate-200 bg-white p-7 shadow-sm">
      <a class="mb-8 inline-flex items-center gap-3 font-black" href="/">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-orange-600 text-white">M</span>
        <span>meetseek 会员账号</span>
      </a>
      <h1 class="text-3xl font-black">重置密码</h1>
      <p class="mt-2 text-sm leading-6 text-slate-500">请输入新密码。提交后，旧登录状态会失效，需要重新登录。</p>
      <form id="reset-form" class="mt-6 grid gap-3">
        <input id="new-password" type="password" class="h-12 rounded-2xl border border-slate-200 px-4 outline-none focus:border-orange-500" placeholder="新密码，至少 8 位" autocomplete="new-password" required>
        <input id="confirm-password" type="password" class="h-12 rounded-2xl border border-slate-200 px-4 outline-none focus:border-orange-500" placeholder="再次输入新密码" autocomplete="new-password" required>
        <button class="h-12 rounded-2xl bg-orange-600 px-5 font-bold text-white shadow-lg shadow-orange-600/20" type="submit">更新密码</button>
        <p id="reset-message" class="min-h-6 text-sm text-slate-500"></p>
      </form>
      <div class="mt-6 rounded-2xl bg-slate-50 p-4 text-sm leading-6 text-slate-500">
        如果你是在找回账号，请回到登录页点“忘记密码 / 找回账号”，输入注册邮箱后获取重置链接。
      </div>
    </section>
  </main>
  <script>
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const form = document.querySelector("#reset-form");
    const message = document.querySelector("#reset-message");
    if (!token) {
      message.textContent = "缺少重置 token，请重新申请找回账号。";
      form.querySelector("button").disabled = true;
      form.querySelector("button").classList.add("opacity-50");
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.querySelector("#new-password").value;
      const confirm = document.querySelector("#confirm-password").value;
      if (password !== confirm) {
        message.textContent = "两次输入的新密码不一致。";
        return;
      }
      const body = new FormData();
      body.append("token", token);
      body.append("password", password);
      body.append("confirm_password", confirm);
      message.textContent = "正在更新密码...";
      const response = await fetch("/api/auth/reset-password", { method: "POST", body });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        message.textContent = data.detail || "重置失败，请重新申请链接。";
        return;
      }
      message.innerHTML = `${escapeHtml(data.message || "密码已更新。")} <a class="font-bold text-orange-600" href="/">去登录</a>`;
      form.reset();
    });
  </script>
</body>
</html>

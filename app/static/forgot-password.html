<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找回密码 - meetseek</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-950">
  <main class="mx-auto flex min-h-screen max-w-lg items-center px-5 py-12">
    <section class="w-full rounded-3xl border border-slate-200 bg-white p-7 shadow-sm">
      <a class="mb-8 inline-flex items-center gap-3 font-black" href="/">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-orange-600 text-white">M</span>
        <span>meetseek 会员账号</span>
      </a>
      <h1 class="text-3xl font-black">找回密码</h1>
      <p class="mt-2 text-sm leading-6 text-slate-500">输入绑定邮箱。系统会发送一个 15 分钟内有效的重置链接。</p>
      <form id="forgot-form" class="mt-6 grid gap-3">
        <input id="email" type="email" class="h-12 rounded-2xl border border-slate-200 px-4 outline-none focus:border-orange-500" placeholder="注册或绑定的邮箱" autocomplete="email" required>
        <button class="h-12 rounded-2xl bg-orange-600 px-5 font-bold text-white shadow-lg shadow-orange-600/20" type="submit">发送重置链接</button>
        <p id="forgot-message" class="min-h-6 text-sm text-slate-500"></p>
      </form>
      <a class="mt-6 inline-flex text-sm font-bold text-slate-500 hover:text-orange-600" href="/login">返回登录</a>
    </section>
  </main>
  <script>
    document.querySelector("#forgot-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.querySelector("#forgot-message");
      const form = new FormData();
      form.append("email", document.querySelector("#email").value.trim());
      message.textContent = "正在发送...";
      const response = await fetch("/api/auth/forgot-password", { method: "POST", body: form });
      const data = await response.json().catch(() => ({}));
      message.textContent = data.message || (response.ok ? "如果邮箱存在，重置链接会发送到邮箱。" : "发送失败");
      message.className = `min-h-6 text-sm ${response.ok ? "text-emerald-600" : "text-rose-600"}`;
    });
  </script>
</body>
</html>

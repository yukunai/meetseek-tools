<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 - meetseek</title>
  <meta name="robots" content="noindex,follow">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-950">
  <main class="grid min-h-screen place-items-center px-5">
    <section class="w-full max-w-md rounded-3xl border border-white/60 bg-white/70 p-8 shadow-sm backdrop-blur-md">
      <a class="flex items-center gap-3" href="/">
        <span class="grid h-11 w-11 place-items-center rounded-2xl bg-orange-600 text-lg font-black text-white">M</span>
        <span class="text-2xl font-black">meetseek</span>
      </a>
      <h1 class="mt-8 text-3xl font-black">创建账号</h1>
      <p class="mt-2 text-sm leading-6 text-slate-500">一个账号同时用于主站、工具箱和提示词库。</p>
      <form id="auth-form" class="mt-8 grid gap-4">
        <input id="name" class="h-12 rounded-2xl border border-slate-200 bg-white px-4 outline-none focus:border-orange-500" placeholder="昵称" autocomplete="nickname" required>
        <input id="email" class="h-12 rounded-2xl border border-slate-200 bg-white px-4 outline-none focus:border-orange-500" type="email" placeholder="邮箱" autocomplete="email" required>
        <input id="password" class="h-12 rounded-2xl border border-slate-200 bg-white px-4 outline-none focus:border-orange-500" type="password" placeholder="密码，至少 8 位" autocomplete="new-password" required>
        <p id="message" class="min-h-5 text-sm font-bold text-rose-600"></p>
        <button class="h-12 rounded-2xl bg-orange-600 px-5 font-black text-white transition hover:bg-orange-700" type="submit">注册并登录</button>
      </form>
      <a class="mt-5 block text-center text-sm font-bold text-slate-500 hover:text-orange-600" href="/login">已有账号？登录</a>
    </section>
  </main>
  <script>
    document.querySelector("#auth-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = document.querySelector("#message");
      message.textContent = "正在注册...";
      const form = new FormData();
      form.append("name", document.querySelector("#name").value.trim());
      form.append("email", document.querySelector("#email").value.trim());
      form.append("password", document.querySelector("#password").value);
      const response = await fetch("/api/auth/register", { method: "POST", body: form });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        message.textContent = data.detail || "注册失败";
        return;
      }
      location.href = "/";
    });
  </script>
</body>
</html>

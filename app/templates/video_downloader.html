{% extends "base.html" %}

{% block content %}
<a href="{{ tools_base_url }}/" class="mb-4 inline-flex items-center gap-1 text-sm font-bold text-slate-400 transition-colors hover:text-slate-700">← 返回 AI 工具箱</a>

<section class="overflow-hidden rounded-[2rem] border border-slate-100 bg-white p-6 shadow-sm md:p-8">
  <div class="flex flex-col gap-5 lg:flex-row lg:items-start lg:justify-between">
    <div>
      <span class="rounded-full bg-orange-50 px-3 py-1 text-xs font-black text-orange-700">原万能下载器</span>
      <h1 class="mt-4 text-3xl font-black tracking-tight text-slate-950 md:text-5xl">万能视频下载</h1>
      <p class="mt-4 max-w-2xl text-sm font-bold leading-7 text-slate-500">粘贴公开视频链接，先解析标题、封面、时长和各清晰度预计大小，再提交后台下载任务。支持 4K、2K、1080P、720P 和仅音频 MP3。</p>
    </div>
    <div class="rounded-3xl border border-orange-100 bg-orange-50/70 p-5 text-sm font-bold leading-7 text-orange-900">
      <p>临时文件保留约 1 小时。</p>
      <p>下载需要登录并按后台积分规则扣分。</p>
    </div>
  </div>
</section>

<section class="mt-6 grid gap-6 xl:grid-cols-[minmax(0,1fr)_22rem]">
  <div class="rounded-[2rem] border border-slate-100 bg-white p-6 shadow-sm md:p-8">
    <form id="video-downloader-form" class="grid gap-5">
      <div class="grid gap-2">
        <label class="text-sm font-black text-slate-700" for="video-url">单个视频链接</label>
        <input id="video-url" name="url" class="h-14 rounded-2xl border border-slate-200 bg-slate-50 px-4 text-sm font-bold outline-none transition focus:border-transparent focus:bg-white focus:ring-2 focus:ring-slate-900" placeholder="粘贴 YouTube / B站 / 抖音 / 小红书等公开视频链接">
      </div>

      <div class="grid gap-3">
        <p class="text-sm font-black text-slate-700">清晰度</p>
        <div id="quality-options" class="flex flex-wrap gap-2">
          <label class="quality-pill cursor-pointer rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-black text-slate-600 transition has-[:checked]:border-orange-200 has-[:checked]:bg-orange-50 has-[:checked]:text-orange-700">
            <input class="mr-2 accent-orange-600" type="radio" name="quality" value="4k">4K
          </label>
          <label class="quality-pill cursor-pointer rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-black text-slate-600 transition has-[:checked]:border-orange-200 has-[:checked]:bg-orange-50 has-[:checked]:text-orange-700">
            <input class="mr-2 accent-orange-600" type="radio" name="quality" value="2k">2K
          </label>
          <label class="quality-pill cursor-pointer rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-black text-slate-600 transition has-[:checked]:border-orange-200 has-[:checked]:bg-orange-50 has-[:checked]:text-orange-700">
            <input class="mr-2 accent-orange-600" type="radio" name="quality" value="1080p" checked>1080P
          </label>
          <label class="quality-pill cursor-pointer rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-black text-slate-600 transition has-[:checked]:border-orange-200 has-[:checked]:bg-orange-50 has-[:checked]:text-orange-700">
            <input class="mr-2 accent-orange-600" type="radio" name="quality" value="720p">720P
          </label>
          <label class="quality-pill cursor-pointer rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-black text-slate-600 transition has-[:checked]:border-orange-200 has-[:checked]:bg-orange-50 has-[:checked]:text-orange-700">
            <input class="mr-2 accent-orange-600" type="radio" name="quality" value="audio">仅音频 MP3
          </label>
        </div>
      </div>

      <label class="flex items-start gap-3 rounded-2xl border border-slate-100 bg-slate-50 p-4 text-sm font-bold leading-6 text-slate-600">
        <input id="video-agree" type="checkbox" class="mt-1 h-4 w-4 accent-orange-600">
        <span>我确认只下载自己有权保存、备份或使用的内容，并遵守来源平台规则。</span>
      </label>

      <div class="flex flex-wrap gap-3">
        <button id="video-info" type="button" class="rounded-2xl bg-slate-100 px-5 py-3 text-sm font-black text-slate-800 transition hover:bg-slate-200">解析信息</button>
        <button id="video-download" type="submit" class="rounded-2xl bg-orange-600 px-5 py-3 text-sm font-black text-white transition hover:bg-orange-700">开始下载</button>
      </div>
    </form>

    <div id="video-result" class="mt-6 hidden rounded-[1.5rem] border border-slate-100 bg-slate-50 p-5"></div>
  </div>

  <aside class="space-y-6">
    <section class="rounded-[2rem] border border-slate-100 bg-white p-6 shadow-sm">
      <h2 class="text-lg font-black">批量下载</h2>
      <p class="mt-2 text-sm font-bold leading-6 text-slate-500">每行一个链接，一次最多 5 个。批量任务使用同一个清晰度。</p>
      <textarea id="video-batch" rows="7" class="mt-4 w-full rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm font-bold leading-6 outline-none transition focus:border-transparent focus:bg-white focus:ring-2 focus:ring-slate-900" placeholder="https://...&#10;https://..."></textarea>
      <button id="video-batch-submit" type="button" class="mt-3 w-full rounded-2xl bg-slate-950 px-5 py-3 text-sm font-black text-white transition hover:bg-orange-600">提交批量任务</button>
    </section>

    <section class="rounded-[2rem] border border-slate-100 bg-white p-6 shadow-sm">
      <h2 class="text-lg font-black">下载任务</h2>
      <div id="task-list" class="mt-4 grid gap-3 text-sm text-slate-500">
        <p class="rounded-2xl bg-slate-50 p-4 font-bold">暂无任务。</p>
      </div>
    </section>
  </aside>
</section>

<script>
(() => {
  const $ = (selector) => document.querySelector(selector);
  const form = $("#video-downloader-form");
  const urlInput = $("#video-url");
  const agreeInput = $("#video-agree");
  const result = $("#video-result");
  const taskList = $("#task-list");
  const batchInput = $("#video-batch");
  const batchButton = $("#video-batch-submit");
  const tasks = new Map();

  function escapeHtml(value) {
    return String(value || "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  function selectedQuality() {
    return document.querySelector('input[name="quality"]:checked')?.value || "1080p";
  }

  function makeFormData(singleUrl) {
    const body = new FormData();
    body.append("url", singleUrl ?? urlInput.value.trim());
    body.append("quality", selectedQuality());
    body.append("agree", agreeInput.checked ? "true" : "false");
    return body;
  }

  async function postForm(path, body) {
    const response = await fetch(path, { method: "POST", body });
    const payload = await response.json().catch(() => ({}));
    if (response.status === 401) {
      window.location.href = "/account";
      throw new Error("请先登录");
    }
    if (!response.ok) throw new Error(payload.detail || "请求失败");
    return payload;
  }

  function showResult(html, tone = "slate") {
    result.classList.remove("hidden");
    result.classList.toggle("border-red-100", tone === "red");
    result.innerHTML = html;
  }

  function renderInfo(data) {
    const sizes = data.sizes || {};
    const sizeRows = Object.entries({
      "4k": "4K",
      "2k": "2K",
      "1080p": "1080P",
      "720p": "720P",
      "audio": "仅音频"
    }).map(([key, label]) => `
      <div class="rounded-2xl bg-white p-3">
        <div class="text-xs font-black text-slate-400">${label}</div>
        <div class="mt-1 text-sm font-black text-slate-800">${escapeHtml(sizes[key] || "未知")}</div>
      </div>
    `).join("");
    showResult(`
      <div class="grid gap-5 lg:grid-cols-[12rem_1fr]">
        ${data.thumbnail ? `<img src="${escapeHtml(data.thumbnail)}" alt="${escapeHtml(data.title)}" class="aspect-video w-full rounded-2xl object-cover">` : `<div class="aspect-video rounded-2xl bg-slate-200"></div>`}
        <div>
          <h3 class="text-xl font-black text-slate-950">${escapeHtml(data.title)}</h3>
          <p class="mt-2 text-sm font-bold text-slate-500">${escapeHtml(data.uploader || "")}${data.duration ? ` · ${escapeHtml(String(data.duration))} 秒` : ""}</p>
          <div class="mt-4 grid grid-cols-2 gap-2 md:grid-cols-5">${sizeRows}</div>
        </div>
      </div>
    `);
  }

  function renderTasks() {
    const rows = Array.from(tasks.values());
    if (!rows.length) {
      taskList.innerHTML = `<p class="rounded-2xl bg-slate-50 p-4 font-bold">暂无任务。</p>`;
      return;
    }
    taskList.innerHTML = rows.map((task) => `
      <article class="rounded-2xl border border-slate-100 bg-slate-50 p-4" data-task-card="${escapeHtml(task.id)}">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="truncate font-black text-slate-900">${escapeHtml(task.title || task.url || task.id)}</p>
            <p class="mt-1 text-xs font-bold text-slate-500">${escapeHtml(task.message || task.status || "")}</p>
          </div>
          <span class="shrink-0 rounded-full bg-white px-2.5 py-1 text-xs font-black text-slate-500">${escapeHtml(String(task.progress || 0))}%</span>
        </div>
        <div class="mt-3 h-2 overflow-hidden rounded-full bg-white">
          <div class="h-full rounded-full bg-orange-500 transition-all" style="width:${Math.max(0, Math.min(100, Number(task.progress || 0)))}%"></div>
        </div>
        ${task.download_url ? `<a class="mt-4 inline-flex rounded-xl bg-slate-950 px-4 py-2 text-xs font-black text-white" href="${escapeHtml(task.download_url)}">下载到本地</a>` : ""}
        ${task.status === "error" ? `<p class="mt-3 text-xs font-bold text-red-600">${escapeHtml(task.message || "下载失败")}</p>` : ""}
      </article>
    `).join("");
  }

  async function pollTask(taskId) {
    try {
      const response = await fetch(`/api/tasks/${encodeURIComponent(taskId)}`);
      if (!response.ok) return;
      const task = await response.json();
      tasks.set(taskId, task);
      renderTasks();
      if (!["done", "error"].includes(task.status)) {
        setTimeout(() => pollTask(taskId), 1500);
      }
    } catch (error) {
      setTimeout(() => pollTask(taskId), 2500);
    }
  }

  $("#video-info")?.addEventListener("click", async () => {
    try {
      showResult(`<p class="font-bold text-slate-500">正在解析视频信息...</p>`);
      const data = await postForm("/api/video/info", makeFormData());
      renderInfo(data);
    } catch (error) {
      showResult(`<p class="font-bold text-red-600">${escapeHtml(error.message)}</p>`, "red");
    }
  });

  form?.addEventListener("submit", async (event) => {
    event.preventDefault();
    try {
      showResult(`<p class="font-bold text-slate-500">任务已提交，正在排队...</p>`);
      const task = await postForm("/api/video/download", makeFormData());
      tasks.set(task.id, task);
      renderTasks();
      pollTask(task.id);
    } catch (error) {
      showResult(`<p class="font-bold text-red-600">${escapeHtml(error.message)}</p>`, "red");
    }
  });

  batchButton?.addEventListener("click", async () => {
    try {
      const body = new FormData();
      body.append("urls", batchInput.value.trim());
      body.append("quality", selectedQuality());
      body.append("agree", agreeInput.checked ? "true" : "false");
      const payload = await postForm("/api/video/batch", body);
      (payload.tasks || []).forEach((task) => {
        tasks.set(task.id, task);
        pollTask(task.id);
      });
      renderTasks();
      showResult(`<p class="font-bold text-slate-500">批量任务已提交。</p>`);
    } catch (error) {
      showResult(`<p class="font-bold text-red-600">${escapeHtml(error.message)}</p>`, "red");
    }
  });
})();
</script>
{% endblock %}

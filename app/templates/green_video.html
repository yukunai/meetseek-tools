{% extends "base.html" %}

{% block content %}
<a href="{{ tools_base_url }}/" class="mb-4 inline-flex items-center gap-1 text-sm font-bold text-slate-400 transition-colors hover:text-slate-700">← 返回 AI 工具箱</a>

<section class="overflow-hidden rounded-[2rem] border border-slate-100 bg-white shadow-sm">
  <div class="border-b border-slate-100 bg-gradient-to-br from-emerald-50 via-white to-orange-50 p-6 md:p-8">
    <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="text-xs font-black uppercase tracking-[0.22em] text-emerald-600">Video Link Parser</p>
        <h1 class="mt-3 text-4xl font-black tracking-tight text-slate-950 md:text-5xl">视频解析下载</h1>
        <p class="mt-4 max-w-2xl text-sm font-bold leading-7 text-slate-500">粘贴公开视频链接，解析封面、标题、视频格式和音频格式。下载通过后端任务重新解析并合并音视频，避免临时直链 403。</p>
      </div>
      <div class="rounded-3xl border border-white/70 bg-white/70 p-4 text-sm font-bold text-slate-500 backdrop-blur">
        <p class="text-slate-950">合规提醒</p>
        <p class="mt-1 max-w-sm leading-6">仅处理您本人拥有权利、已获授权或公开可保存的内容；不支持绕过 DRM 或受保护内容。</p>
      </div>
    </div>
  </div>

  <div class="grid gap-6 p-5 md:p-8 xl:grid-cols-[1fr_22rem]">
    <form id="green-video-form" class="rounded-[1.5rem] border border-slate-100 bg-slate-50/70 p-5">
      <label class="text-sm font-black text-slate-700" for="green-video-url">视频链接</label>
      <div class="mt-3 flex flex-col gap-3 md:flex-row">
        <input id="green-video-url" name="url" type="text" class="h-14 min-w-0 flex-1 rounded-2xl border border-slate-200 bg-white px-4 text-sm font-bold outline-none transition focus:border-transparent focus:ring-2 focus:ring-slate-900" placeholder="可直接粘贴抖音/YouTube 分享口令或公开视频链接">
        <button id="green-video-submit" type="submit" class="rounded-2xl bg-slate-950 px-7 py-4 text-sm font-black text-white transition hover:bg-orange-600">开始解析</button>
      </div>
      <label class="mt-4 flex items-start gap-3 rounded-2xl bg-white p-4 text-sm font-bold leading-6 text-slate-500">
        <input id="green-video-agree" type="checkbox" class="mt-1 h-4 w-4 accent-orange-600">
        <span>我确认只解析有权保存或使用的公开视频内容，不用于侵权传播。</span>
      </label>
      <p id="green-video-status" class="mt-4 min-h-6 text-sm font-bold text-slate-500"></p>
    </form>

    <aside class="rounded-[1.5rem] border border-slate-100 bg-white p-5 shadow-sm">
      <h2 class="text-lg font-black text-slate-950">支持能力</h2>
      <div class="mt-4 grid gap-3 text-sm font-bold text-slate-500">
        <div class="rounded-2xl bg-emerald-50 p-4 text-emerald-700">封面图提取</div>
        <div class="rounded-2xl bg-orange-50 p-4 text-orange-700">视频格式列表</div>
        <div class="rounded-2xl bg-slate-50 p-4 text-slate-700">仅音频入口</div>
      </div>
    </aside>
  </div>
</section>

<section id="green-video-result" class="mt-6 hidden rounded-[2rem] border border-slate-100 bg-white p-5 shadow-sm md:p-8"></section>

<template id="green-video-empty-template">
  <div class="rounded-3xl border border-dashed border-slate-200 bg-slate-50 p-8 text-center">
    <p class="text-sm font-bold text-slate-400">解析结果会显示在这里。</p>
  </div>
</template>

<script>
  (() => {
    const form = document.getElementById("green-video-form");
    const input = document.getElementById("green-video-url");
    const agree = document.getElementById("green-video-agree");
    const status = document.getElementById("green-video-status");
    const submit = document.getElementById("green-video-submit");
    const result = document.getElementById("green-video-result");

    const escapeHtml = (value) => String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const setStatus = (message, tone = "slate") => {
      status.textContent = message;
      status.className = `mt-4 min-h-6 text-sm font-bold ${tone === "red" ? "text-red-600" : tone === "green" ? "text-emerald-600" : "text-slate-500"}`;
    };

    let lastParsedUrl = "";
    let activeTaskTimer = null;

    const postForm = async (path, body) => {
      const response = await fetch(path, { method: "POST", body });
      if (response.status === 401) {
        window.location.href = "/account";
        throw new Error("请先登录后再下载");
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "请求失败");
      return data;
    };

    const pollTask = (taskId, node) => {
      if (activeTaskTimer) clearInterval(activeTaskTimer);
      activeTaskTimer = setInterval(async () => {
        try {
          const response = await fetch(`/api/tasks/${encodeURIComponent(taskId)}`);
          const task = await response.json();
          if (!response.ok) throw new Error(task.detail || "任务查询失败");
          node.innerHTML = task.status === "done"
            ? `<a href="${escapeHtml(task.download_url)}" class="rounded-full bg-emerald-600 px-4 py-2 text-xs font-black text-white transition hover:bg-emerald-700">下载到本地</a><span class="text-xs font-bold text-emerald-600">处理完成，文件会自动清理。</span>`
            : `<span class="text-xs font-black text-slate-500">${escapeHtml(task.message || "处理中")} · ${escapeHtml(task.progress || 0)}%</span>`;
          if (task.status === "done" || task.status === "error") {
            clearInterval(activeTaskTimer);
            activeTaskTimer = null;
            if (task.status === "error") {
              node.innerHTML = `<span class="text-xs font-black text-red-600">${escapeHtml(task.message || "下载失败")}</span>`;
            }
          }
        } catch (error) {
          clearInterval(activeTaskTimer);
          activeTaskTimer = null;
          node.innerHTML = `<span class="text-xs font-black text-red-600">${escapeHtml(error.message || "任务查询失败")}</span>`;
        }
      }, 1800);
    };

    const startBackendDownload = async (quality, node) => {
      const body = new FormData();
      body.append("url", lastParsedUrl || input.value.trim());
      body.append("quality", quality || "1080p");
      body.append("agree", "true");
      node.innerHTML = `<span class="text-xs font-black text-slate-500">正在创建下载任务...</span>`;
      try {
        const task = await postForm("/api/green-video/download", body);
        node.innerHTML = `<span class="text-xs font-black text-slate-500">${escapeHtml(task.message || "任务已排队")}</span>`;
        pollTask(task.id, node);
      } catch (error) {
        node.innerHTML = `<span class="text-xs font-black text-red-600">${escapeHtml(error.message || "下载任务创建失败")}</span>`;
      }
    };

    const formatRows = (items, type) => {
      if (!items || !items.length) {
        return `<p class="rounded-2xl bg-slate-50 p-4 text-sm font-bold text-slate-400">未解析到${type === "audio" ? "音频" : "视频"}格式。</p>`;
      }
      return items.map((item) => {
        const label = type === "audio"
          ? `${escapeHtml(item.ext || "audio")} ${item.abr ? `${escapeHtml(item.abr)}kbps` : ""}`
          : `${escapeHtml(item.resolution || item.note || "视频")} ${item.ext ? `· ${escapeHtml(item.ext)}` : ""}`;
        const badges = [
          item.size ? `<span>${escapeHtml(item.size)}</span>` : "",
          item.has_audio ? `<span>含音频</span>` : type === "video" ? `<span>仅视频</span>` : "",
          item.fps ? `<span>${escapeHtml(item.fps)}fps</span>` : "",
        ].filter(Boolean).join("");
        return `
          <div class="group flex flex-col gap-3 rounded-2xl border border-slate-100 bg-slate-50 p-4 transition hover:border-orange-200 hover:bg-orange-50 md:flex-row md:items-center md:justify-between">
            <span>
              <b class="block text-sm text-slate-900">${label}</b>
              <span class="mt-1 flex flex-wrap gap-2 text-xs font-bold text-slate-400">${badges}</span>
            </span>
            <span class="flex shrink-0 flex-wrap items-center gap-2">
              <button type="button" data-quality="${escapeHtml(item.download_quality || (type === "audio" ? "audio" : "1080p"))}" class="green-task-download rounded-full bg-slate-950 px-4 py-2 text-xs font-black text-white transition hover:bg-orange-600">后端下载</button>
              <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer nofollow" class="rounded-full border border-slate-200 bg-white px-4 py-2 text-xs font-black text-slate-500 transition hover:bg-slate-100">尝试直链</a>
            </span>
          </div>
        `;
      }).join("");
    };

    const renderResult = (data) => {
      const cover = data.thumbnail
        ? `<img src="${escapeHtml(data.thumbnail)}" alt="${escapeHtml(data.title)}" loading="lazy" class="h-full w-full object-cover">`
        : `<div class="grid h-full w-full place-items-center bg-slate-100 text-sm font-bold text-slate-400">无封面</div>`;
      const coverLink = data.cover && data.cover.url
        ? `<a href="${escapeHtml(data.cover.url)}" target="_blank" rel="noopener noreferrer nofollow" class="rounded-full border border-slate-200 bg-white px-4 py-2 text-xs font-black text-slate-600 transition hover:bg-slate-100">打开封面</a>`
        : "";
      result.innerHTML = `
        <div class="grid gap-6 xl:grid-cols-[23rem_1fr]">
          <div class="overflow-hidden rounded-3xl border border-slate-100 bg-slate-50">
            <div class="aspect-video">${cover}</div>
            <div class="p-5">
              <p class="text-xs font-black uppercase tracking-wide text-slate-400">${escapeHtml(data.domain || "video")}</p>
              <h2 class="mt-2 text-2xl font-black leading-tight text-slate-950">${escapeHtml(data.title)}</h2>
              <p class="mt-3 text-sm font-bold leading-6 text-slate-500">${escapeHtml(data.uploader || "")}${data.duration ? ` · ${escapeHtml(data.duration)}` : ""}</p>
              <div class="mt-5 flex flex-wrap gap-2">
                <a href="${escapeHtml(data.webpage_url)}" target="_blank" rel="noopener noreferrer nofollow" class="rounded-full bg-slate-950 px-4 py-2 text-xs font-black text-white transition hover:bg-orange-600">打开原视频</a>
                ${coverLink}
              </div>
            </div>
          </div>
          <div class="grid gap-5">
            <section>
              <div class="mb-3 flex items-center justify-between">
                <h3 class="text-lg font-black text-slate-950">视频格式</h3>
                <span class="text-xs font-bold text-slate-400">部分格式可能是仅视频轨</span>
              </div>
              <div class="grid gap-3">${formatRows(data.formats.video, "video")}</div>
            </section>
            <section>
              <h3 class="mb-3 text-lg font-black text-slate-950">音频格式</h3>
              <div class="grid gap-3">${formatRows(data.formats.audio, "audio")}</div>
            </section>
          </div>
        </div>
      `;
      result.classList.remove("hidden");
      result.querySelectorAll(".green-task-download").forEach((button) => {
        button.addEventListener("click", () => startBackendDownload(button.dataset.quality, button.parentElement));
      });
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      result.classList.add("hidden");
      if (!input.value.trim()) {
        setStatus("请先粘贴视频链接。", "red");
        return;
      }
      if (!agree.checked) {
        setStatus("请先勾选合规确认。", "red");
        return;
      }
      const body = new FormData();
      body.append("url", input.value.trim());
      body.append("agree", "true");
      submit.disabled = true;
      submit.textContent = "解析中...";
      setStatus("正在解析视频信息，部分平台可能需要等待几十秒。");
      try {
        const response = await fetch("/api/green-video/info", { method: "POST", body });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "解析失败");
        lastParsedUrl = data.webpage_url || input.value.trim();
        renderResult(data);
        setStatus("解析完成。", "green");
      } catch (error) {
        setStatus(error.message || "解析失败，请稍后再试。", "red");
      } finally {
        submit.disabled = false;
        submit.textContent = "开始解析";
      }
    });
  })();
</script>
{% endblock %}

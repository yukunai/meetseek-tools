<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meta.title }}</title>
  <meta name="description" content="{{ meta.description }}">
  {% if meta.canonical_url %}
  <link rel="canonical" href="{{ meta.canonical_url }}">
  {% endif %}
  <meta property="og:type" content="{{ meta.og_type | default('website') }}">
  <meta property="og:site_name" content="{{ meta.site_name | default('meetseek') }}">
  <meta property="og:title" content="{{ meta.og_title | default(meta.title) }}">
  <meta property="og:description" content="{{ meta.og_description | default(meta.description) }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ meta.og_title | default(meta.title) }}">
  <meta name="twitter:description" content="{{ meta.og_description | default(meta.description) }}">
  {% if meta.og_image %}
  <meta property="og:image" content="{{ meta.og_image }}">
  <meta name="twitter:image" content="{{ meta.og_image }}">
  {% endif %}
  <script nonce="{{ request.state.csp_nonce }}" src="https://cdn.tailwindcss.com?plugins=typography,line-clamp"></script>
  <script nonce="{{ request.state.csp_nonce }}" defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak]{display:none!important}
    body{letter-spacing:0}
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-[#f4f6fa] text-slate-950 antialiased">
  <header class="sticky top-0 z-40 border-b border-slate-200/70 bg-white/82 backdrop-blur-xl">
    <div class="mx-auto grid max-w-[1480px] grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-4 px-5 py-4">
      <a href="/" class="flex min-w-0 items-center gap-3">
        <span class="grid h-10 w-10 place-items-center rounded-2xl bg-orange-600 font-black text-white">M</span>
        <span class="truncate text-2xl font-black">meetseek</span>
      </a>
      <form class="hidden min-w-0 justify-self-center lg:block" action="/category/general" method="get">
        <label class="relative block w-[min(560px,42vw)]">
          <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">⌕</span>
          <input class="h-11 w-full rounded-2xl border border-slate-200 bg-slate-50/85 pl-10 pr-4 text-sm font-bold outline-none transition placeholder:text-slate-400 focus:border-orange-200 focus:bg-white" name="q" placeholder="搜索工具、提示词、文章、用户...">
        </label>
      </form>
      <nav class="flex justify-end gap-2 text-sm font-bold text-slate-500">
        <a class="hidden rounded-full bg-white px-4 py-2 ring-1 ring-slate-200 transition hover:text-slate-950 sm:inline-flex" href="/">首页</a>
        <a class="rounded-full bg-white px-4 py-2 ring-1 ring-slate-200 transition hover:text-slate-950" href="https://tools.meetseek.ai">工具箱</a>
        <a class="rounded-full bg-slate-950 px-4 py-2 text-white transition hover:bg-orange-600" href="https://prompts.meetseek.ai">提示词</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-[1480px] px-5 py-6">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
